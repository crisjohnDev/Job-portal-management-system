{% extends 'home_base.html' %}
{% load static %}

{% block content %}
<style>
    /* --- Form Container Alignment --- */
    .form-workspace-card {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(12px);
        width: 100%;
        max-width: 440px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.2);
        z-index: 10;
        text-align: left;
        margin: 40px auto;
    }

    .form-workspace-card h2 {
        color: #011409;
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: -0.02em;
    }

    .form-workspace-card p {
        color: #4b5563;
        font-size: 0.9rem;
        margin-bottom: 28px;
    }

    /* --- Form Field Components --- */
    .field-group {
        margin-bottom: 20px;
    }

    .field-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #047857;
        margin-bottom: 6px;
    }

    .password-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .field-group input[type="text"],
    .field-group input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        font-size: 0.95rem;
        color: #0f172a;
        background-color: #f8fafc;
        outline: none;
        transition: all 0.2s ease;
    }

    .password-input-wrapper input {
        padding-right: 48px !important;
    }

    .field-group input:focus {
        border-color: #059669;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
    }

    /* --- Password Eye Action Button --- */
    .password-toggle-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
    }

    .password-toggle-btn:hover {
        color: #059669;
    }

    .password-toggle-btn svg {
        width: 20px;
        height: 20px;
    }

    /* --- Submit & Options --- */
    .btn-login-submit {
        width: 100%;
        padding: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        background-color: #059669;
        color: #ffffff;
        border: none;
        border-radius: 99px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        margin-top: 10px;
    }

    .btn-login-submit:hover {
        background-color: #047857;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(5, 150, 105, 0.4);
    }

    .form-footer-options {
        margin-top: 24px;
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        line-height: 1.5;
    }

    .form-footer-options a {
        color: #059669;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.2s ease;
    }

    .form-footer-options a:hover {
        color: #047857;
        text-decoration: underline;
    }
</style>

<div class="form-workspace-card">
    <h2>Account Login</h2>
    <p>Sign in to access your custom PESO dashboard panel.</p>

    <form id="loginForm" method="POST">
        {% csrf_token %}

        <div class="field-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your registered username" required autocomplete="username">
        </div>

        <div class="field-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="password" name="password" placeholder="Enter security password" required autocomplete="current-password">
                
                <button type="button" class="password-toggle-btn" id="passwordToggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-login-submit">Sign In</button>
        
        <div class="form-footer-options">
            Don't have an account yet? <br>
            Register as an <a href="{% url 'applicant-registration' %}">Applicant</a> or <a href="{% url 'employee-registration' %}">Employer</a>
        </div>
    </form>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    }
</script>
{% endblock %}
