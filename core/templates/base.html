{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/PIODURAN.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/PIODURAN.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/PIODURAN.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESO Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #011409;
            --sidebar-bg: rgba(2, 36, 18, 0.92);
            --sidebar-border: rgba(255, 255, 255, 0.08);
            --emerald-primary: #059669;
            --emerald-hover: #047857;
            --mint-accent: #34d399;
            --sidebar-width: 260px;
            --text-light: #ffffff;
            --text-sub: #a7f3d0;
            --text-muted: rgba(255, 255, 255, 0.65);
            --card-bg: rgba(2, 36, 18, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #032b16 0%, #011409 75%);
            color: var(--text-light);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SIDEBAR NAVIGATION --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }

        /* Institutional Brand Section inside Sidebar */
        .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-brand-logo {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .sidebar-brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sidebar-brand-text h1 {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .sidebar-brand-text p {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
            font-weight: 500;
        }

        /* Sidebar Navigation Items */
        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
            flex: 1;
        }

        .sidebar-menu-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .sidebar-menu-item a svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-muted);
            fill: none;
            transition: stroke 0.2s ease;
        }

        .sidebar-menu-item a:hover {
            background-color: rgba(5, 150, 105, 0.2);
            color: #ffffff;
            border-left-color: var(--mint-accent);
        }

        .sidebar-menu-item a:hover svg {
            stroke: var(--mint-accent);
        }

        /* Active State Style */
        .sidebar-menu-item.active a {
            background-color: rgba(5, 150, 105, 0.35);
            color: #ffffff;
            border-left-color: var(--mint-accent);
            font-weight: 700;
        }

        .sidebar-menu-item.active a svg {
            stroke: var(--mint-accent);
        }

        /* Utility Footer Link (Logout) */
        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 0;
        }

        .sidebar-footer a {
            border-left-color: transparent !important;
        }
        
        .sidebar-footer a:hover {
            background-color: rgba(220, 38, 38, 0.25) !important;
            color: #fca5a5 !important;
        }

        .sidebar-footer a:hover svg {
            stroke: #fca5a5 !important;
        }

        /* --- MAIN CONTENT CONTAINER --- */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR STAYS FIXED ON THE LEFT -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-logo">
                <img src="{% static 'images/PESO.png' %}" alt="PESO">
            </div>
            <div class="sidebar-brand-text">
                <h1>PESO Admin</h1>
                <p>Pio Duran Portal</p>
            </div>
        </div>

        <!-- MAIN CORE NAVIGATION LINKS -->
        <ul class="sidebar-menu">
            <li class="sidebar-menu-item">
                <a href="{% url 'peso-dashboard' %}">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="{% url 'employer-list' %}">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    Employer
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="{% url 'applicant-list' %}">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Applicants
                </a>
            </li>
            <li class="sidebar-menu-item">
                <a href="{% url 'job-post-list' %}">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Job Post List
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a href="{% url 'reports' %}">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Reports
                </a>
            </li>
        </ul>

        <!-- UTILITY FOOTER BLOCK (LOGOUT AREA) -->
        <div class="sidebar-footer">
            <li class="sidebar-menu-item" style="list-style: none;">
                <a href="{% url 'logout' %}">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Log Out
                </a>
            </li>
        </div>
    </aside>

    <!-- SYSTEM DASHBOARD INTERFACE AREA -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- AUTO-ACTIVATION SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname;
            const menuItems = document.querySelectorAll(".sidebar-menu-item a");

            menuItems.forEach(link => {
                const href = link.getAttribute("href");
                if (href && href !== "#" && currentPath === href) {
                    link.parentElement.classList.add("active");
                }
            });
        });
    </script>
</body>
</html>
