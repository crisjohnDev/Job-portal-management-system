{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/PIODURAN.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/PIODURAN.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/PIODURAN.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | PESO Portal</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- Formal Green Theme Variables --- */
        :root {
            --gov-green: #064e3b;          /* Primary Deep Forest Green */
            --gov-green-light: #059669;    /* Bright Accent Green */
            --gov-green-surface: #ecfdf5;  /* Subtle Green Tint */
            --gov-red: #b91c1c;
            --text-dark: #0f172a;
            --bg-canvas: #f8fafc;
            --sidebar-width: 260px;
        }

        /* --- Global Resets & Baseline --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Top Header Navigation Layer --- */
        .portal-navbar {
            height: 70px;
            background-color: var(--gov-green);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            box-shadow: 0 4px 12px rgba(6, 78, 59, 0.15);
        }

        .portal-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .portal-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .portal-brand h2 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .portal-brand span {
            font-size: 0.75rem;
            background-color: var(--gov-red);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* --- Dashboard Core Layout --- */
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 70px);
            margin-top: 70px; 
            width: 100%;
        }

        /* --- Fixed Sidebar --- */
        .dashboard-sidebar {
            width: var(--sidebar-width);
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            position: fixed;
            top: 70px;
            bottom: 0;
            left: 0;
            z-index: 40;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #475569;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .sidebar-link svg {
            width: 20px;
            height: 20px;
            color: #64748b;
            transition: color 0.2s;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .sidebar-link:hover {
            background-color: var(--gov-green-surface);
            color: var(--gov-green-light);
        }

        .sidebar-link:hover svg {
            color: var(--gov-green-light);
        }

        .sidebar-link.active {
            background-color: var(--gov-green-surface);
            color: var(--gov-green);
            border-left: 4px solid var(--gov-green-light);
            border-radius: 0 8px 8px 0;
            padding-left: 12px;
        }

        .sidebar-link.active svg {
            color: var(--gov-green);
        }

        .sidebar-link.logout-link {
            color: #dc2626;
        }

        .sidebar-link.logout-link svg {
            color: #dc2626;
        }

        .sidebar-link.logout-link:hover {
            background-color: #fef2f2;
        }

        /* --- Main Workspace Viewport --- */
        .dashboard-main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            max-width: 1400px;
            width: calc(100% - var(--sidebar-width));
        }

        /* --- Responsive Styling --- */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
            .dashboard-sidebar {
                width: 100%;
                position: relative;
                top: 0;
                bottom: auto;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
                padding: 16px;
                height: auto;
            }
            .dashboard-main {
                margin-left: 0;
                width: 100%;
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- PORTAL STATIC TOP GLOBAL HEADER BAR -->
    <nav class="portal-navbar">
        <div class="portal-brand">
            <img src="{% static 'images/PESO.png' %}" alt="PESO Logo" class="portal-logo">
            <h2>PESO Job Placement Portal</h2>
            <span>Employer Center</span>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- STICKY SIDE NAVIGATION BAR -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-menu">
                <a href="{% url 'employer-dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'employer-dashboard' %}active{% endif %}">
                    <svg viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    Home
                </a>
                
                <a href="{% url 'job-list' %}" class="sidebar-link {% if request.resolver_match.url_name == 'job-list' %}active{% endif %}">
                    <svg viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Job Post
                </a>
                
                <a href="{% url 'applicants' %}" class="sidebar-link {% if request.resolver_match.url_name == 'applicants' %}active{% endif %}">
                    <svg viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    Applicants
                </a>
            </div>

            <div class="sidebar-footer">
                <a href="{% url 'logout_user' %}" class="sidebar-link logout-link">
                    <svg viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Logout
                </a>
            </div>
        </aside>

        <!-- MAIN STAGE CONTEXT -->
        <main class="dashboard-main">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
