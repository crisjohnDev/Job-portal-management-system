{% extends "home_base.html" %}

{% block content %}

<style>

    .verification-wrapper {
        width: 100%;
        min-height: 70vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px 20px;

        box-sizing: border-box;
    }


    .verification-card {
        width: 100%;
        max-width: 450px;

        background: #011409;

        border: 1px solid rgba(116, 188, 68, 0.35);

        padding: 40px 30px;

        box-sizing: border-box;

        text-align: center;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.35);
    }


    .verification-card h2 {
        margin: 0 0 12px;

        color: #ffffff;

        font-size: 28px;

        font-weight: 700;
    }


    .verification-card p {
        margin: 0 0 25px;

        color: rgba(255, 255, 255, 0.75);

        line-height: 1.6;
    }


    .otp-input {
        width: 100%;

        box-sizing: border-box;

        padding: 15px;

        background: #ffffff;

        border: 2px solid transparent;

        color: #111111;

        font-size: 26px;

        font-weight: 700;

        text-align: center;

        letter-spacing: 8px;

        outline: none;
    }


    .otp-input:focus {
        border-color: #74BC44;
    }


    .verify-button {
        width: 100%;

        margin-top: 20px;

        padding: 15px;

        border: none;

        background: #74BC44;

        color: #011409;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.2s ease;
    }


    .verify-button:hover {
        background: #5ea132;
    }


    .error-message {
        margin-bottom: 20px;

        padding: 12px;

        background: rgba(220, 53, 69, 0.15);

        border: 1px solid rgba(220, 53, 69, 0.4);

        color: #ff8f9b;

        font-size: 14px;
    }


    .verification-note {
        margin-top: 20px !important;

        font-size: 13px !important;

        color: rgba(255, 255, 255, 0.55) !important;
    }


    @media (max-width: 480px) {

        .verification-wrapper {
            padding: 25px 15px;
        }


        .verification-card {
            padding: 30px 20px;
        }


        .verification-card h2 {
            font-size: 24px;
        }


        .otp-input {
            font-size: 22px;

            letter-spacing: 5px;
        }

    }

</style>


<div class="verification-wrapper">

    <div class="verification-card">

        <h2>
            Verify Your Mobile Number
        </h2>


        <p>
            We sent a 6-digit verification code
            to your registered mobile number.
        </p>


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <input
                type="text"
                name="otp"
                class="otp-input"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                required
            >


            <button
                type="submit"
                class="verify-button"
            >
                Verify Account
            </button>

        </form>


        <p class="verification-note">
            Your verification code is valid for 5 minutes.
        </p>

    </div>

</div>

{% endblock %}
