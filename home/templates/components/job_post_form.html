{% extends 'employer_base.html' %}

{% block content %}

<style>

.form-card{
    max-width:1000px;
    margin:auto;
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
    overflow:hidden;
}

.form-header{
    background:#0c2340;
    color:#fff;
    padding:25px 35px;
}

.form-header h1{
    font-size:28px;
    font-weight:800;
}

.form-header p{
    margin-top:5px;
    color:#cbd5e1;
}

.form-body{
    padding:35px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:600;
    margin-bottom:8px;
    color:#334155;
}

input,
select,
textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
    font-family:inherit;
}

textarea{
    resize:vertical;
    min-height:140px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.required{
    color:#dc2626;
}

.form-footer{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:35px;
}

.btn{
    text-decoration:none;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-secondary{
    background:#e2e8f0;
    color:#334155;
}

.btn-secondary:hover{
    background:#cbd5e1;
}

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

}

</style>

<div class="form-card">

    <div class="form-header">

        {% if job %}
            <h1>Edit Job Post</h1>
            <p>Update the information of this job posting.</p>
        {% else %}
            <h1>Create Job Post</h1>
            <p>Fill in the details below to publish a new job opportunity.</p>
        {% endif %}

    </div>

    <div class="form-body">

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group full">
                    <label>Job Title <span class="required">*</span></label>
                    <input type="text"
                           name="title"
                           value="{{ job.title|default:'' }}"
                           placeholder="e.g. Software Developer"
                           required>
                </div>

                <div class="form-group">
                    <label>Salary <span class="required">*</span></label>
                    <input type="number"
                           name="salary"
                           value="{{ job.salary|default:'' }}"
                           placeholder="25000"
                           required>
                </div>

                <div class="form-group">
                    <label>Location <span class="required">*</span></label>
                    <input type="text"
                           name="location"
                           value="{{ job.location|default:'' }}"
                           placeholder="Purok, st. , Brgy , Pioduran, Albay"
                           required>
                </div>

                <div class="form-group">
                    <label>Job Type <span class="required">*</span></label>

                    <select name="job_type" required>

                        <option value="">Select Job Type</option>

                        <option value="Full Time"
                        {% if job.job_type == "Full Time" %}selected{% endif %}>
                        Full Time
                        </option>

                        <option value="Part Time"
                        {% if job.job_type == "Part Time" %}selected{% endif %}>
                        Part Time
                        </option>

                        <option value="Contract"
                        {% if job.job_type == "Contract" %}selected{% endif %}>
                        Contract
                        </option>

                        <option value="Internship"
                        {% if job.job_type == "Internship" %}selected{% endif %}>
                        Internship
                        </option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Vacancies <span class="required">*</span></label>
                    <input type="number"
                           name="vacancies"
                           value="{{ job.vacancies|default:'' }}"
                           placeholder="5"
                           required>
                </div>

                <div class="form-group full">
                    <label>Application Deadline <span class="required">*</span></label>
                    <input type="date"
                           name="deadline"
                           value="{{ job.deadline|date:'Y-m-d' }}"
                           required>
                </div>

                <div class="form-group full">
                    <label>Job Description <span class="required">*</span></label>
                    <textarea name="description"
                              placeholder="Describe the job..."
                              required>{{ job.description|default:'' }}</textarea>
                </div>

                <div class="form-group full">
                    <label>Qualifications <span class="required">*</span></label>
                    <textarea name="qualifications"
                              placeholder="List qualifications..."
                              required>{{ job.qualifications|default:'' }}</textarea>
                </div>

                <div class="form-group full">
                    <label>Responsibilities <span class="required">*</span></label>
                    <textarea name="responsibilities"
                              placeholder="List responsibilities..."
                              required>{{ job.responsibilities|default:'' }}</textarea>
                </div>

            </div>

            <div class="form-footer">

                <a href="{% url 'job-list' %}" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">

                    {% if job %}
                        Update Job
                    {% else %}
                        Publish Job
                    {% endif %}

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
